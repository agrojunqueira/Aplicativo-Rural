<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aplicativo Rural — Login</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b1220;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;}
    .card{width:100%;max-width:420px;background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.35);}
    h1{font-size:16px;margin:0 0 8px;}
    .muted{color:#9ca3af;font-size:12px;line-height:1.4;margin-bottom:14px;}
    label{font-size:12px;color:#cbd5e1;font-weight:600;display:block;margin:10px 0 6px;}
    input,button{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0b1220;color:#fff;font-size:14px;}
    button{cursor:pointer;border:none;background:#2563eb;font-weight:700;margin-top:12px;}
    button.secondary{background:transparent;border:1px solid rgba(255,255,255,.18);}
    .row{display:flex;gap:10px;margin-top:10px;}
    .row > *{flex:1}
    .msg{margin-top:10px;font-size:13px}
    .ok{color:#34d399}
    .err{color:#fb7185}
  </style>
</head>
<body>
  <div class="card">
    <h1>Aplicativo Rural — Login</h1>
    <div class="muted">Entre com email e senha. Se não tiver conta, cadastre.</div>

    <label>Email</label>
    <input id="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="username" />

    <label>Senha</label>
    <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />

    <label>Seu nome (no cadastro)</label>
    <input id="nome" type="text" placeholder="Ex: Zé Ramilton" />

    <div class="row">
      <button class="secondary" id="btnSignup" type="button">Cadastrar</button>
      <button id="btnLogin" type="button">Entrar</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://kqsbjgqtplvooxnqcmft.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_b8R_PutuU4EUd3Tomdq7Bg_j-eqr-H7";
    const EMPRESA_ID = "agrojunqueira";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    async function ensureProfile(sb, empresaId, nome = "") {
  const { data: userData } = await sb.auth.getUser();
  const uid = userData?.user?.id;
  if (!uid) return null;

  const { data: profile } = await sb
    .from("usuarios")
    .select("id, empresa_id, role, nome")
    .eq("id", uid)
    .maybeSingle();

  if (!profile) {
    await sb.rpc("ensure_user_profile", {
      p_empresa_id: empresaId,
      p_nome: nome || ""
    });
  }

  const { data: profile2 } = await sb
    .from("usuarios")
    .select("id, empresa_id, role, nome")
    .eq("id", uid)
    .single();

  return profile2;
}

    const msg = (txt, ok=false) => {
      const el = document.getElementById("msg");
      el.className = "msg " + (ok ? "ok" : "err");
      el.textContent = txt;
    };

    async function ensureProfile(nomeDigitado) {
      const { data: userData, error: userError } = await sb.auth.getUser();
      if (userError) throw userError;

      const user = userData?.user;
      if (!user) throw new Error("Usuário não autenticado.");

      // 🔥 AQUI é o ponto crítico: tem que ser "nome" (não "name")
      const payload = {
        id: user.id,
        empresa_id: EMPRESA_ID,
        nome: (nomeDigitado && nomeDigitado.trim()) ? nomeDigitado.trim() : (user.email || "Usuário"),
        role: "user"
      };

      const { error } = await sb
        .from("usuarios")
        .upsert(payload, { onConflict: "id" });

      if (error) throw error;
      return true;
    }

    document.getElementById("btnSignup").onclick = async () => {
      try {
        msg("Cadastrando...");
        const email = document.getElementById("email").value.trim();
        const pass = document.getElementById("pass").value.trim();
        const nome = document.getElementById("nome").value.trim();

        if (!email || !pass) return msg("Preencha email e senha.");

        const { data, error } = await sb.auth.signUp({ email, password: pass });
        if (error) throw error;

        // Em muitos casos o signUp NÃO cria session na hora (depende de confirmação de email)
        if (data?.session) {
          await ensureProfile(nome);
          msg("Cadastro OK. Indo pro mapa...", true);
          window.location.href = "./index.html";
          return;
        }

        msg("Cadastro realizado. Se o Supabase exigir, confirme seu email e depois faça login.", true);
      } catch (e) {
        msg("Erro: " + (e?.message || e));
      }
    };

    document.getElementById("btnLogin").onclick = async () => {
      try {
        msg("Entrando...");
        const email = document.getElementById("email").value.trim();
        const pass = document.getElementById("pass").value.trim();
        const nome = document.getElementById("nome").value.trim();

        if (!email || !pass) return msg("Preencha email e senha.");

        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        if (!error) {
  const profile = await ensureProfile(sb, "agrojunqueira", data.user.email);

  // (opcional) salvar em memória pra usar no app
  // localStorage.setItem("user_role", profile?.role || "user");
  // localStorage.setItem("empresa_id", profile?.empresa_id || "agrojunqueira");

  window.location.href = "./index.html";
  return;
}

        await ensureProfile(nome);

        msg("Login OK. Indo pro mapa...", true);
        window.location.href = "./index.html";
      } catch (e) {
        msg("Erro: " + (e?.message || e));
      }
    };

    // Se já estiver logado, manda pro mapa
    (async () => {
      try {
        const { data } = await sb.auth.getSession();
        if (data?.session) window.location.href = "./index.html";
      } catch (e) {}
    })();
  </script>
</body>
</html>
