<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />

  <!-- iPhone / PWA friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#111827" />

  <title>Aplicativo Rural — MVP</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body { height: 100%; }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; overflow:hidden;}

    .app{display:flex;height:100vh;}

    .side{
  width:420px; min-width:380px; max-width:520px;
      overflow-y:auto; background:#fff; z-index:2000;
      border-right:1px solid #e5e7eb;
      -webkit-overflow-scrolling: touch;
    }

    .brand{padding:14px 14px 10px;border-bottom:1px solid #e5e7eb;}
    .brand h1{margin:0;font-size:16px;}
    .brand .sub{margin:6px 0 0;color:#6b7280;font-size:12px;line-height:1.3;}

.controls{
  padding:10px 14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.controls select{
  width:100%;
  box-sizing:border-box;
}

/* Força o select do modo */
#modeSel{
  width:100% !important;
  max-width:100% !important;
  box-sizing:border-box !important;
}
#modeSel{
  width:100% !important;
  display:block;
  box-sizing:border-box;
}
    select,input,button,textarea{
  width:100%;
  padding:12px 14px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:15px;
  height:46px;
}
    button{cursor:pointer;background:#111827;color:#fff;border:none;border-radius:10px;}
    button.secondary{background:#f3f4f6;color:#111827;border:1px solid #e5e7eb;}
    .tab{
  padding: 8px 12px;
  border: 1px solid #ddd;
  background: #f7f7f7;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
}

.tab.active{
  background: #111827;
  color: #fff;
  border-color: #111827;
}

    .panel{padding:14px;overflow:auto;}
    .card{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:12px;}
    .muted{color:#6b7280;font-size:12px}
    .row{display:flex;gap:10px;}
    .row > *{flex:1;}

    #map{flex:1;height:100vh; min-height: 0;}
    /* ===== Layout upgrade (safe) ===== */
.side{
  padding: 10px 12px 14px;
}

.card{
  background:#fff;
  border:1px solid #e7edf3;
  border-radius:16px;
  padding:14px;
  box-shadow: 0 4px 14px rgba(0,0,0,.04);
}

.topline{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}

.pill{
  display:inline-flex;
  gap:6px;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  background:#f6f8fb;
  border:1px solid #e7edf3;
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px 12px;
  margin-top:10px;
}

.k{
  color:#6b7280;
  font-size:12px;
  margin-bottom:2px;
}
.v{
  font-weight:700;
  font-size:14px;
}

.row{
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.row button{
  width:100%;
  height:44px;
  border-radius:14px;
}

button{
  transition: transform .06s ease, opacity .2s ease;
}
button:active{
  transform: scale(.99);
}

.tabs{
  display:flex;
  gap:10px;
  margin:12px 0 6px;
}
.tab{
  flex:1;
  height:38px;
  border-radius:12px;
  border:1px solid #e7edf3;
  background:#f6f8fb;
  font-weight:700;
}
.tab.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.muted{
  color:#6b7280;
}

    /* ====== MODAL ====== */
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      display:none; align-items:center; justify-content:center;
      padding:16px; z-index:9999;
    }
    .modal{
      background:#fff; border-radius:16px; max-width:520px; width:100%;
      max-height:92vh; overflow:auto; border:1px solid #e5e7eb;
    }
    .modal header{padding:14px 16px;border-bottom:1px solid #e5e7eb;}
    .modal main{padding:16px;}
    .modal footer{padding:14px 16px;border-top:1px solid #e5e7eb;display:flex;gap:10px;justify-content:flex-end;}
    label{font-size:12px;color:#374151;font-weight:600;display:block;margin:10px 0 6px;}

    /* ====== BOTÃO + (FAB) ====== */
    #fabAdd{
      display:none;
      position:fixed;
      left:18px; bottom:88px;
      width:64px; height:64px;
      border-radius:999px;
      border:none;
      font-size:34px;
      font-weight:800;
      background:#111827;
      color:#fff;
      z-index:7000;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
    }

    /* ====== MOBILE ====== */
    @media (max-width: 900px){
      body{ overflow:hidden; }
      .app{flex-direction:column;height:100vh;}
      .side{
        width:100%;
        max-width:none;
        min-width:0;
        position:sticky;
        top:0;
        z-index:5000;
        border-right:none;
        border-bottom:1px solid #e5e7eb;
        max-height: 46vh;
        overflow-y:auto;
        -webkit-overflow-scrolling: touch;
      }
      #map{flex:1;height:auto;min-height: 54vh;}
      #fabAdd{ display:block; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="side" id="sidebar">
      <div class="brand">
        <h1>Aplicativo Rural — MVP (Mapa + Talhão)</h1>
        <div class="sub">Mapa + ocorrências + fotos no Supabase Storage.</div>
      </div>

      <div class="controls">
        <div class="row" style="margin-bottom:10px;">
          </select>
          <select id="modeSelect">
            <option value="talhao">Modo: Talhão</option>
            <option value="fazenda">Modo: Fazenda</option>
          </select>
        </div>

        <select id="farmSelect">
          <option value="">Carregando fazendas…</option>
        </select>
      </div>

      <div class="panel">
        <div class="card" id="infoCard">
          <div class="muted">Selecione uma fazenda e clique em um talhão.</div>
        </div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Botão + flutuante -->
  <button id="fabAdd" title="Criar ocorrência">+</button>

  <!-- Libs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.6.2/dist/togeojson.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Supabase (UMA vez só) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- CONFIG SUPABASE (NÃO PODE TER <script> DENTRO!) -->
  <script>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <header>
        <div id="modalTitle" style="font-weight:700;">Nova ocorrência</div>
        <div class="muted" id="modalSub"></div>
      </header>
      <main id="modalBody"></main>
      <footer>
        <button class="secondary" id="modalCancel">Cancelar</button>
        <button id="modalSave">Salvar</button>
      </footer>
    </div>
  </div>

  <!-- ✅ Guard de login: se não tiver sessão, vai pro login -->
  <script>
    (async () => {
      try {
        if (!window.supabase) return;

        const url = window.__SUPABASE_URL;
        const key = window.__SUPABASE_ANON_KEY;

        if (!url || !key) {
          console.warn("Supabase config ausente no index.html");
          return;
        }

     window.__sb = window.__sb || window.supabase.createClient(url, key);
const sb = window.__sb;
        const { data, error } = await sb.auth.getSession();
        if (error) console.warn(error);

        if (!data?.session) {
          window.location.href = "./login.html";
        }
      } catch (e) {
        console.error("Guard login falhou:", e);
      }
    })();
    async function ensureProfile(sb, empresaId, nome = "") {
  const { data: userData } = await sb.auth.getUser();
  const uid = userData?.user?.id;
  if (!uid) return;

  const { data: profile } = await sb
    .from("usuarios")
    .select("id, empresa_id, role, nome")
    .eq("id", uid)
    .maybeSingle();

  if (!profile) {
    await sb.rpc("ensure_user_profile", {
      p_empresa_id: empresaId,
      p_nome: nome || ""
    });
  }

  const { data: profile2 } = await sb
    .from("usuarios")
    .select("id, empresa_id, role, nome")
    .eq("id", uid)
    .single();

  return profile2;
}
  </script>

  <!-- App -->
  <script src="./app.js"></script>

  <script>
    // mata SW antigo cacheando (evita bug no iPhone/atalho)
    try{
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));
      }
    }catch(e){}

    // Leaflet “mapa branco” no iPhone
    function fixLeafletSize() {
      const m = window.__leafletMap;
      if (m && m.invalidateSize) setTimeout(() => m.invalidateSize(), 250);
    }
    window.addEventListener("load", fixLeafletSize);
    window.addEventListener("resize", fixLeafletSize);
    document.addEventListener("visibilitychange", fixLeafletSize);
    window.addEventListener("pageshow", fixLeafletSize);
  </script>
</body>
</html>
